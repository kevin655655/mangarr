version: '3.8'

services:
  backend:
    build: ./backend
    container_name: mangarr-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_PATH=/app/data/mangarr.db
      - MANGABAKA_URL=${MANGABAKA_URL:-https://api.mangabaka.com}
    networks:
      - mangarr-network

  frontend:
    build: ./frontend
    container_name: mangarr-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - mangarr-network

networks:
  mangarr-network:
    driver: bridge
