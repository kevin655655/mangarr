version: '3.8'

services:
  mangarr:
    build: .
    container_name: mangarr
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/app/data/mangarr.db
      - MANGABAKA_URL=${MANGABAKA_URL:-https://api.mangabaka.com}
