version: "3.8"

services:
  mangarr:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mangarr
    ports:
      - "8787:8787"
    volumes:
      - ./config:/app/config
      - ./data:/app/data
    environment:
      - MANGARR_CONFIG_DIR=/app/config
      - MANGARR_DATA_DIR=/app/data
      - MANGARR_LOG_LEVEL=info
    restart: unless-stopped
    networks:
      - mangarr-net

networks:
  mangarr-net:
    driver: bridge
